# AWS CodeBuild: build the production image and push it to ECR.
# Driven by scripts/deploy_fargate.py, which supplies the environment variables.
version: 0.2
env:
  variables:
    IMAGE_TAG: latest
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  build:
    commands:
      - docker build -f docker/Dockerfile -t "$ECR_REPO:$IMAGE_TAG" -t "$ECR_REPO:build-$CODEBUILD_BUILD_NUMBER" .
  post_build:
    commands:
      - docker push --all-tags "$ECR_REPO"
      - docker image inspect "$ECR_REPO:$IMAGE_TAG" --format 'image size bytes={{.Size}}'
